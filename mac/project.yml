name: TouchBridge
options:
  bundleIdPrefix: dev.touchbridge
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

include:
  - daemon/targets.yml
  - menubar/targets.yml

packages:
  TouchBridgeProtocol:
    path: ../protocol/swift
  ArgumentParser:
    url: https://github.com/apple/swift-argument-parser.git
    from: "1.3.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

schemes:
  touchbridge:
    build:
      targets:
        touchbridge: all
    test:
      targets:
        - TouchBridgeCoreTests
  TouchBridgeMenu:
    build:
      targets:
        TouchBridgeMenu: all
        touchbridge: all
        TouchBridgeHelper: all
