syntax = "proto3";

package touchbridge;

option java_package = "dev.touchbridge.android.proto";
option java_multiple_files = true;
option swift_prefix = "TB";

// TouchBridge wire protocol definitions.
//
// Single source of truth for all platforms (macOS daemon, iOS companion,
// Android companion). Code is generated via:
//   protoc --swift_out=... --kotlin_out=... touchbridge.proto
//
// Wire format on BLE: [version:1byte][type:1byte][protobuf payload]
// The version and type bytes are prepended outside of protobuf — they
// identify the message for routing before deserialization.

// ---------------------------------------------------------------------------
// Message types — matches the [type] byte in the wire header.
// ---------------------------------------------------------------------------

enum MessageType {
  MESSAGE_TYPE_UNSPECIFIED = 0;
  PAIR_REQUEST   = 1;
  PAIR_RESPONSE  = 2;
  CHALLENGE_ISSUED = 3;
  CHALLENGE_RESPONSE = 4;
  ERROR          = 5;
  IDENTIFY       = 6;
}

// ---------------------------------------------------------------------------
// Pairing
// ---------------------------------------------------------------------------

// Sent by companion → Mac to initiate pairing.
message PairRequest {
  string device_name = 1;
  bytes  public_key = 2;        // X9.63 uncompressed P-256 public key (65 bytes)
  string device_id = 3;         // Stable companion device identifier
  bytes  pairing_token = 4;     // One-time token from QR payload (optional on re-pair)
}

// Sent by Mac → companion to accept/reject pairing.
message PairResponse {
  string device_id = 1;         // Mac-assigned device ID for this companion
  bytes  public_key = 2;        // Mac's P-256 public key
  bool   accepted = 3;
}

// ---------------------------------------------------------------------------
// Challenge / Response
// ---------------------------------------------------------------------------

// Sent by Mac → companion with an encrypted nonce to sign.
message ChallengeIssued {
  string challenge_id = 1;
  bytes  encrypted_nonce = 2;   // AES-256-GCM: nonce(12) + ciphertext + tag(16)
  string reason = 3;            // Human-readable reason ("sudo", "screensaver", ...)
  uint64 expiry_unix = 4;       // Challenge expiry timestamp
}

// Sent by companion → Mac with the signed nonce.
message ChallengeResponse {
  string challenge_id = 1;
  bytes  signature = 2;         // ECDSA P-256 signature of the decrypted nonce
  string device_id = 3;
}

// ---------------------------------------------------------------------------
// Identify (reconnect without full re-pairing)
// ---------------------------------------------------------------------------

// Sent by companion → Mac after ECDH to identify a previously-paired device.
// The signature proves possession of the paired private key — without it,
// any device that completes ECDH could claim a known deviceID.
message Identify {
  string device_id = 1;
  string device_name = 2;
  bytes  signature = 3;         // ECDSA P-256 signature of (device_id || ephemeral_pub_key)
                                // Signed with the device's long-term paired key.
                                // Required — daemon rejects Identify without a valid signature.
}

// ---------------------------------------------------------------------------
// Error
// ---------------------------------------------------------------------------

message Error {
  uint32 code = 1;
  string description = 2;
  string challenge_id = 3;      // Optional: challenge this error relates to
}

// Well-known error codes.
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  KEY_INVALIDATED = 1001;       // Biometric enrollment changed since pairing
}

// ---------------------------------------------------------------------------
// Pairing payload (QR code content, not sent over BLE)
// ---------------------------------------------------------------------------

// JSON-encoded in the QR code, not protobuf — this is scanned by the
// companion camera before any BLE connection exists.
// Fields:
//   macName:      string  — Mac's display name
//   serviceUUID:  string  — Per-Mac BLE service UUID to scan for
//   pairingToken: string  — Base64 one-time pairing token
//   macID:        string  — Mac's stable identifier
